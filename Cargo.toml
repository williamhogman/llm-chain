[workspace]
resolver = "3"
members = [
    "llm-chain",
    "llm-chain-anthropic",
    "llm-chain-gemini",
    "llm-chain-openai",
    "llm-chain-tools",
    "llm-chain-llama",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = [
    "William Rudenmalm <william@sobel.io>",
    "Emil Juzovitski <emil@sobel.io>",
]
repository = "https://github.com/sobelio/llm-chain/"

[workspace.dependencies]
llm-chain = { path = "llm-chain", version = "0.2.0" }
async-openai = { version = "0.41", features = ["chat-completion"] }
futures = "0.3.31"
llama-cpp-2 = "0.1.153"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
thiserror = "2.0"
tokio = { version = "1.53", default-features = false }
trait-variant = "0.1.3"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
uninlined_format_args = "allow"

[profile.release]
lto = "thin"

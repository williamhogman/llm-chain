[package]
name = "llm-chain-llama"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A library implementing `llm-chains` for LLaMA-family models via llama.cpp (GGUF). Chains can be used to apply the model series to complete complex tasks, such as agents."
license.workspace = true
keywords = ["llm", "langchain", "llama", "chain"]
categories = ["science"]
authors.workspace = true
readme = "./README.md"
repository.workspace = true

[features]
default = ["serialization"]
serialization = ["llm-chain/serialization", "dep:serde"]
# GPU / accelerator backends, forwarded to llama.cpp
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
llama-cpp-2.workspace = true
llm-chain.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

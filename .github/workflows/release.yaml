name: Release

# Publishes every workspace crate to crates.io, in dependency order, when a
# version tag (v*) is pushed. Requires the CARGO_REGISTRY_TOKEN repository
# secret. See docs/RELEASING.md for the full checklist.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check tag matches workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: verify
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev
      - uses: Swatinem/rust-cache@v2
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # cargo publish (1.66+) waits for each crate to be available in the
          # index before returning, so sequential publishes are safe.
          for crate in llm-chain llm-chain-openai llm-chain-anthropic \
                       llm-chain-gemini llm-chain-bedrock llm-chain-ollama \
                       llm-chain-llama llm-chain-tools; do
            echo "::group::Publishing $crate"
            cargo publish -p "$crate"
            echo "::endgroup::"
          done

  github-release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for $version" > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
